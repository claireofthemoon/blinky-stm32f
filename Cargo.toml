[package]
authors = ["Claire Barnes <claire@puzzledpigeon.com>"]
name = "app"
edition = "2024"
version = "0.1.0"

[[bin]]
name = "app"
path = "src/main.rs"
test = false
doctest = false
bench = false

[dependencies]
cortex-m = { version = "0.7.10", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.7"
panic-halt = "1.0.0"
stm32f0 = { version = "0.16.0", features = ["stm32f0x2"] }
